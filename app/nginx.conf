server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Débloque les threads WASM : sans ces deux en-têtes, ONNX Runtime retombe
  # silencieusement sur un seul thread.
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header X-Content-Type-Options "nosniff" always;

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
  gzip_min_length 1024;
  gzip_static on;

  default_type application/octet-stream;

  # Les poids sont immuables : ils portent leur version dans le nom du cache
  # côté client, et le navigateur ne doit pas les revalider.
  location ~* \.(onnx|wasm|whl|zip|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
