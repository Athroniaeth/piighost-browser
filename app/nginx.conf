server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Unlocks WASM threads. Without these two headers ONNX Runtime silently
  # falls back to a single thread.
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "require-corp" always;
  add_header X-Content-Type-Options "nosniff" always;

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
  gzip_min_length 1024;
  gzip_static on;

  default_type application/octet-stream;

  # Weights are immutable. They carry their version in the client-side cache
  # name, and the browser must not revalidate them.
  location ~* \.(onnx|wasm|whl|zip|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
