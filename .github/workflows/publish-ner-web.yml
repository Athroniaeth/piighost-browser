# Publishes @piighost/ner-web without a token, over OIDC.
#
# npm recognises this workflow as a trusted publisher, so no secret is stored in
# the repository. The filename matters: it is declared as-is in the package
# configuration on npmjs.com, so renaming it breaks publishing.
#
# A package's first upload cannot go through here. npm requires the package to
# exist before it accepts a trusted publisher configuration, so the initial
# version goes out with a token and this workflow takes over afterwards.
name: publish ner-web

on:
  push:
    tags:
      - "ner-web-v*"
  workflow_dispatch:

permissions:
  # Without this npm receives no OIDC token and falls back on an authentication
  # that does not exist here.
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ner-web
    steps:
      - uses: actions/checkout@v5

      # No registry-url here. setup-node would then write an .npmrc pointing at
      # NODE_AUTH_TOKEN, which does not exist since the whole point is to store
      # no secret. npm would send that empty credential and fail with a 401
      # without ever attempting the OIDC exchange.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The npm shipped with Node is often older than OIDC support, and the
      # failure it produces does not say why. The version is pinned rather than
      # followed: this npm holds the right to publish over OIDC, so a
      # compromised release would publish under our name. The price is bumping
      # it by hand.
      - name: Install npm 12.0.2
        run: npm install -g npm@12.0.2

      - name: Install
        run: npm ci

      # The package directory holds the transformers.js model cache, which is
      # over a hundred megabytes. The files field excludes it, and this step
      # checks that it still does.
      - name: Check the package contents
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          if grep -qE '\.onnx|\.cache/' /tmp/pack.txt; then
            echo "Model weights would enter the package." >&2
            exit 1
          fi

      # The trusted publisher grants npm publish alongside staging, so releases
      # are automatic. Removing that permission on npm and replacing the command
      # with npm stage publish would put a manual 2FA promotion back between the
      # workflow and its users.
      - name: Publish
        run: npm publish
